[project]
name = "quora-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "himanshukr72", email = "himanshukr72830@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "bs4>=0.0.2",
    "distance>=0.1.3",
    "emoji>=2.15.0",
    "fuzzywuzzy>=0.18.0",
    "gensim>=4.4.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pyspellchecker>=0.9.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8.16",
    "spellchecker>=0.4",
    "torch>=2.14.1",
    "tqdm>=4.70.0",
    "transformers>=5.18.0",
    "wget>=3.2",
    "xgboost>=3.4.1",
]
[project.scripts]
quora-challenge = "quora_challenge:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
