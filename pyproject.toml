[project]
name = "quora-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "himanshukr72", email = "himanshukr72830@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "nltk",
    "xgboost",
    "rapidfuzz",
    "transformers",
    "datasets",
    "accelerate",
    "torch",
    "sentencepiece",
    "jupyter",
    "ipykernel",
    "tqdm",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 880.12.22,<0.13.0"]
build-backend = "uv_build"
